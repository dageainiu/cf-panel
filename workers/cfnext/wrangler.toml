name = "cfnext"
main = "entry.js"
compatibility_date = "2024-10-01"

[vars]
# U: VLESS UUID（必填，同时用作面板路径，除非在 KV config 里设置 path）
U = "YOUR_VLESS_UUID"

[[kv_namespaces]]
binding = "K"
id = "YOUR_KV_CFNEXT_ID"

# 可选：定时自动优选节点（BESTIP_AUTO=1 时生效）
# [triggers]
# crons = ["*/30 * * * *"]
# [vars]
# BESTIP_AUTO = "1"

# 说明：
# - 首次访问面板路径（/<U>）会强制设置管理密码（ADMIN），之后登录进入。
# - 更多环境变量（PROXYIP / S / TROJAN / ECH / YX 等）见 worker.js 头部注释。
